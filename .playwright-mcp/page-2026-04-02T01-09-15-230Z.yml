            - heading "Everything you’ve ever wanted to know about your flight—and more." [level=2] [ref=e460]
            - paragraph [ref=e463]: "Flighty keeps you informed by tracking more information about your flight than any other app—like the #1 and #2 biggest causes of delays. Know exactly what’s happening and how it affects your flight, so you can finally just enjoy your trip."
          - generic [ref=e464]:
            - generic [ref=e466]:
              - paragraph [ref=e468]: See why you’re delayed. Finally!
              - paragraph [ref=e471]: Airlines often keep delay information under wraps until the last minute. Flighty doesn’t. We track the inbound aircraft 25 hours before your flight, so we can predict a new departure time long before the airline notifies you.
            - generic [ref=e486]:
              - paragraph [ref=e490]:
                - text: Delay predictions. Long before airlines admit it.
                - text: "Late planes are the #1 cause of delays. Flighty uses machine learning to predict delays due to late arriving aircraft — up to 6 hours before the airline says anything."
              - generic [ref=e499]:
                - paragraph [ref=e502]: "Direct from the tower. Air Traffic Control mandates are the #2 cause of delays. Flighty sifts through these and tells you what might impact your flight: like ground stops, weather, or airport issues."
