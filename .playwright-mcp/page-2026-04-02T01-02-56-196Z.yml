        - heading "Can you remember the first time you got on an airplane?" [level=2] [ref=e134]
        - paragraph [ref=e137]: We can. It was a magical experience, in every sense of the word. As a kid you take trains, buses, cars—but getting on an airplane is a wholly different experience. And, maybe like you, we were hooked from the first takeoff.
        - paragraph [ref=e140]: Unfortunately, as stories so often go, the magic fades as you get older. Flying starts to feel like a means to an end. Delays strike seemingly out of nowhere, your airplane gets a new gate 20 minutes before takeoff (and your airline often fails to notify you about this). While the kids in the airport marvel at the magic of air travel, you’re scrambling to the nearest flight board to make sure you’re headed to the right gate, that your flight is still on time.
        - paragraph [ref=e143]: We’re flight nerds at heart. We built Flighty so that we, and all the other travelers around the world, could fall in love with flying all over again. So we could have smoother trips—where all the information we care about is in the palm of our hand, or available at the flick of a wrist. Not at the mercy of a faulty flight board or a text message from an airline.
        - paragraph [ref=e146]: "We obsess over the little things: pilot-grade data, perfectly timed notifications, and quality design (in 2023, we won an Apple Design Award for this obsession)."
        - paragraph [ref=e149]: We’ll worry about the details. You just have a nice flight.
        - paragraph [ref=e152]: — Ryan, Markus, and Francesc
