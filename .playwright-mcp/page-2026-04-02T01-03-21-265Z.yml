              - paragraph [ref=e357]: Like a perfectly prepared dish, this recipe app is all about getting the details right. When the app’s sharp-looking cooking mode is activated, recipe steps, measurements, and timing details are subtly dimmed and highlighted at the proper time. Timers integrate with the Dynamic Island, recipe scanning is powered by the Vision framework, and ingredients plug right into the Reminders app. And for the cherry on top, Mela lets you subscribe to RSS feeds from cooking sites and can extract recipes from social media video descriptions.
