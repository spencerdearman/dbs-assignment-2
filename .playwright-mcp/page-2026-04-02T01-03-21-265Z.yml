                - heading "Denim - Playlist Cover Maker" [level=4] [ref=e100]
              - paragraph [ref=e101]: Feel Good Tech, India
              - paragraph [ref=e102]: iPhone
              - paragraph [ref=e103]: "Denim creates brilliant new cover art for your playlists, but the app isn’t just about aesthetics: This is a seamless SwiftUI-built experience, with smooth scroll transitions and elegant text and mesh gradients. It’s also a joy to play with, thanks to custom haptics, intelligent cropping, and cool depth effects. Denim is a simple, well-executed idea that adds an extra dimension to the art of playlist creation."
