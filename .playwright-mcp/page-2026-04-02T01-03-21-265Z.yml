                - heading "Ground News" [level=4] [ref=e428]
              - paragraph [ref=e429]: Snapwise, Canada
              - paragraph [ref=e430]: iPhone, iPad
              - paragraph [ref=e431]: A news aggregator that helps people view how media outlets across the political spectrum are covering or downplaying a topic. Ground News presents news coverage from thousands of publications worldwide alongside a graph that evaluates the political bent of an article or outlet (which is ranked by a third-party service and users). Every design element, from color-coded bias markers to user-friendly layouts, has been carefully crafted to inspire trust, transparency, and a desire to explore multiple viewpoints.
