              - paragraph [ref=e514]: iPhone, iPad, Apple Watch
              - paragraph [ref=e515]: A subtle example of excellence. Vocabulary is powered by charming, consistent illustrations that create a clean visual style and rhythm throughout. Typography and iconography feel modern and balanced, themes are nicely varied, and the use of haptics is a nice touch. A lovely instance of an app that quietly does everything right.
