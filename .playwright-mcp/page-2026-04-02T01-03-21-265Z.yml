              - paragraph [ref=e525]: Apple Vision Pro
              - paragraph [ref=e526]:
                - text: CellWalk is a biology class like none other. This highly evolved visionOS app allows organisms to explore a 3D cell model delivered with incredible fidelity and detail. It’s a revelation to regard a 300 million-atom bacterial cell through this kind of beautiful, real-time Metal-powered rendering — which has been optimized for
