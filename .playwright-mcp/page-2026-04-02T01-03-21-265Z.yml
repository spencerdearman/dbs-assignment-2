              - link "Balatro" [ref=e117] [cursor=pointer]:
                - /url: https://apps.apple.com/us/app/id6502453075
                - heading "Balatro" [level=4] [ref=e118]
              - paragraph [ref=e119]: LocalThunk, Canada
              - paragraph [ref=e120]: iPhone, iPad, Mac, Apple TV, Apple Vision Pro
              - paragraph [ref=e121]: No game captured the community this past year quite like Balatro, a precisely calibrated mix of poker, solitaire, deck-building, and chaos. Crafted by a solo developer working under a pseudonym and delivered with a tinge of rakish audacity, this captivatingly innovative card game challenges players to beat a score by building unique decks while navigating an ever-shifting array of variables, such as power-up jokers and “Boss Blinds” that can reduce the most lovingly crafted deck to a pile of rubble. Balatro re-emphasizes the boundless potential of indie games and the idea that a simple and powerful concept can grow into a phenomenon.
          - generic [ref=e123]:
            - link [ref=e124] [cursor=pointer]:
              - /url: https://apps.apple.com/us/app/thank-goodness-youre-here/id6504887308?mt=12
              - figure [ref=e125]
            - generic [ref=e126]:
              - link "Thank Goodness You’re Here!" [ref=e127] [cursor=pointer]:
                - /url: https://apps.apple.com/us/app/thank-goodness-youre-here/id6504887308?mt=12
                - heading "Thank Goodness You’re Here!" [level=4] [ref=e128]
              - paragraph [ref=e129]: Panic, USA
              - paragraph [ref=e130]: Mac
              - paragraph [ref=e131]: "It’s safe to say Thank Goodness You’re Here! is the best wildly unhinged slap-happy pie-obsessed flower-punching cartoon musical comedy game you’ll play all year. Deliriously giddy, surprisingly polished, and the inventor and probably pinnacle of the slapformer genre, this profoundly bonkers production practically flings itself from scene to scene, churning out absurdities — one level takes place inside a slab of meat, maybe? — and a madcap cast of fishmongers, bad gardeners, and chimney sweeps that somehow add up to a cohesively built world. Here’s the craziest part: Hiding inside the lost threepences and large hams is a delightful game that keeps bubbling up compelling quests and backstories. It’s a credit to the entire creative team that Thank Goodness You’re Here! isn’t just genuinely funny from beginning to end; it’s also a real artistic achievement and a rewarding play experience."
          - generic [ref=e133]:
