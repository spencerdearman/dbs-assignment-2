            - generic [ref=e391]:
              - 'link "Skate City: New York" [ref=e392] [cursor=pointer]':
                - /url: https://apps.apple.com/us/app/id6448986810
                - 'heading "Skate City: New York" [level=4] [ref=e393]'
              - paragraph [ref=e394]: Snowman, Canada
              - paragraph [ref=e395]: iPhone, iPad, Mac, Apple TV
              - paragraph [ref=e396]: "Packed with cool combos to perform and obstacles to navigate, Skate City: New York plays equally well with touch and controller. Its patient onboarding affords plenty of time to learn its wealth of kickflips, manuals, and grinds, which you can then upgrade through smartly spaced-out lessons. The result is easy to pick up, but with enough challenge to keep even expert digital skaters glued to its virtual boards."
