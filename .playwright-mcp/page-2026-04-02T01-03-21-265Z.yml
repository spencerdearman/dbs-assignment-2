              - paragraph [ref=e504]: iPad
              - paragraph [ref=e505]: An incredible modeling tool that allows artists to easily transform their 2D designs into fully immersive 3D creations. Feather is designed from the ground up with user experience and creativity in mind, packing powerful and advanced 3D modeling features inside a minimalist interface that’s accessible to all skill levels. The iPad-only app makes full use of touch and Apple Pencil interactions.
