                - 'heading "Watch Duty: Wildfire Maps" [level=4] [ref=e418]'
              - paragraph [ref=e419]: Sherwood Forestry Service, USA
              - paragraph [ref=e420]: iPhone, iPad
              - paragraph [ref=e421]: When wildfires tore through southern California in January, Watch Duty served as a primary source for essential, ever-changing, and sometimes life-saving information. A non-commercial operation run by volunteers, Watch Duty once again proved itself the go-to app for a community impacted by wildfires, clearly and reliably offering updates, resources, and real-time guidance. Watch Duty’s core functions and integrations are certainly impressive in their own right. But the best thing that can be said is that the app continued to step up when it needed to.
