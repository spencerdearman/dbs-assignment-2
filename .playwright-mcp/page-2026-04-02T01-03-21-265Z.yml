              - paragraph [ref=e439]: Opal OS, USA
              - paragraph [ref=e440]: iPhone, iPad
              - paragraph [ref=e441]: Opal helps people establish a more intentional relationship with technology by encouraging less time on devices. And it’s a delightful experience in its own right, full of helpful tools like widgets, Shortcuts, and easy-to-set-up customizations. And fun touches like haptics when unlocking “gems” deliver a charming way to create focus.
