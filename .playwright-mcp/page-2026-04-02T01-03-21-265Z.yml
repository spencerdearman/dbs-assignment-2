              - paragraph [ref=e247]: Rabbit 3 Times, USA
              - paragraph [ref=e248]: iPhone, Mac
              - paragraph [ref=e249]: For such a sophisticated tool, Play offers incredibly approachable prototyping capabilities that make design and development easier for everyone. Play helps designers create interactive prototypes using native SwiftUI frameworks, which can then be sent to Xcode and used for shipping finished apps. The well-designed UI is nicely organized, visually pleasing, and cleverly integrated with App Clips. Plus, everything you create in Play — including logic and interactions — matches perfectly with Xcode.
