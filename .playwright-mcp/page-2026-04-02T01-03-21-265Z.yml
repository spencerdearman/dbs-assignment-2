                - /url: https://apps.apple.com/us/app/train-fitness-for-apple-watch/id1548577496
                - heading "Train Fitness" [level=4] [ref=e183]
              - paragraph [ref=e184]: Train Fitness, Canada
              - paragraph [ref=e185]: iPhone, iPad
              - paragraph [ref=e186]: Train Fitness logs workouts by using CoreMotion and CoreML to track the motion of a user’s Apple Watch and AirPods, eliminating the need for interaction with a screen or UI. This thoughtful approach makes Train Fitness particularly useful for people who are blind or low vision, or anyone who may face challenges interacting with screens. With specific modes designed for workouts in wheelchairs and for users with limb differences, Train Fitness proves a dedication to both platform and audience.
          - separator [ref=e187]
