              - paragraph [ref=e285]: Philipp Stollenmayer, Germany
              - paragraph [ref=e286]: iPhone, iPad
              - paragraph [ref=e287]: A charming story game with polished execution and impressive production values — and did we mention it’s a snack-based musical reboot of “Romeo and Juliet”? Created by Philipp Stollenmayer and sandwiched somewhere between narrative and game, PBJ tells the story of star-crossed condiments through paper cutouts animated by hand and a soundtrack full of sticky earworms (complete with a karaoke mode) — and it even jams in a few puns. With delightful controls, creative camera angles, cool haptics, and countless clever moments, PBJ never stops spreading joy.
