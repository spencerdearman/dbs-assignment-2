              - link "DREDGE" [ref=e371] [cursor=pointer]:
                - /url: https://apps.apple.com/us/app/id6526463862
                - heading "DREDGE" [level=4] [ref=e372]
              - paragraph [ref=e373]: Black Salt Games, New Zealand
              - paragraph [ref=e374]: iPhone, iPad, Mac
              - paragraph [ref=e375]: A two-word idea — “Lovecraftian fishing” — inspired this appealingly creepy debut from Black Salt Games, whose creative team all admits to spending more time fishing in video games than in real life. DREDGE is a slow-paced horror adventure set in a maritime town where dark and large secrets lurk below the surface. The game’s submerged monsters may be unsettling, but its interactions are smooth sailing across touch and controller, both in its main narrative and fun mini-games. And it’s a seamless experience across iPhone, iPad, and Mac.
          - generic [ref=e377]:
            - link [ref=e378] [cursor=pointer]:
              - /url: https://apps.apple.com/us/app/id6471676214
              - figure [ref=e379]
              - figure [ref=e380]
            - generic [ref=e381]:
