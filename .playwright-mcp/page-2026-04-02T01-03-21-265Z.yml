                - heading "puffies." [level=4] [ref=e211]
              - paragraph [ref=e212]: Lykke Studios, Thailand and Cyprus
              - paragraph [ref=e213]: iPhone, iPad, Mac, Apple TV, Apple Vision Pro
              - paragraph [ref=e214]: Lykke Studios returns to the Apple Design Awards with a nostalgic puzzler built for everyone. Players assemble puzzles made of ’80s-era puffy stickers — more than 2,500 of them, all drawn by local artists from Bangkok and Bali. As in their 2023 Apple Design Award winner Stitch and 2022 finalist Tint, the studio prioritized accessibility from Day 1, integrating features like Reduce Motion, a high-contrast mode, and a series of “outline settings” that add focus to certain parts of the board.
          - generic [ref=e216]:
            - link [ref=e217] [cursor=pointer]:
              - /url: https://apps.apple.com/au/app/land-of-livia/id1052641617
              - figure [ref=e218]
            - generic [ref=e219]:
              - link "Land of Livia" [ref=e220] [cursor=pointer]:
                - /url: https://apps.apple.com/au/app/land-of-livia/id1052641617
                - heading "Land of Livia" [level=4] [ref=e221]
              - paragraph [ref=e222]: Split Atom Labs, Australia
              - paragraph [ref=e223]: iPhone, iPad, Mac, Apple Vision Pro
              - paragraph [ref=e224]: A low-key fantasy adventure you can play at your own speed. Battle oversized rodents, recruit companions, discover magical swords, and turn your zero into a hero by undertaking text-based quests that unfold while you’re away from the game. With support for VoiceOver, Dynamic Type, and Haptics, Land of Livia is specifically designed for players who are blind or low vision. And it takes advantage of App Intents to let players carry out complex actions.
