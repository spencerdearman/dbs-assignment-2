              - paragraph [ref=e478]: Klemens Strausser, Austria
              - paragraph [ref=e479]: iPhone, iPad
              - paragraph [ref=e480]: "A uniquely drawn puzzle game that prioritizes inclusivity and ecology in equal measure. Inspired by an encounter with 18th and 19th-century science texts, Art of Fauna’s classical wildlife puzzles can be solved by either re-arranging the image on the front of the cards or re-ordering the text description on the back. It’s a warm, serene way to bring awareness to the plight of endangered species, and a bit of a love letter to science. And it backs up its message: Proceeds from every purchase support conservation organizations."
