                - text: If you’re a photographer looking to follow the sun, or an aspiring astronomer who wants to know what a little moonlight can do, this thoughtfully crafted sun and moon tracker can help. With a simple design, carefully curated color palette, and elegant widgets and Live Activities, Lumy offers a quick and intuitive way to get celestial information. Plus, it syncs beautifully with
                - generic [ref=e93]: Apple Watch,
