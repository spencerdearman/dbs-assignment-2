              - paragraph [ref=e267]: Digital Workroom Ltd., United Kingdom
              - paragraph [ref=e268]: iPhone, iPad
              - paragraph [ref=e269]: An impressive transcription, translation, and summarization tool that offers an astonishing level of accuracy — and an adorable aesthetic. A relaxed little capybara hangs out on the screen while the app is doing its thing, and the results are delivered right away, all powered by the Apple Intelligence Translate API. A simple and endearing interface for a complex task.
