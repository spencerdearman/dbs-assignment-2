                - 'heading "Prince of Persia: The Lost Crown" [level=4] [ref=e138]'
              - paragraph [ref=e139]: Ubisoft Montpellier, France
              - paragraph [ref=e140]: iPhone, iPad, Mac
              - paragraph [ref=e141]: "This masterful franchise revival delivers a stylish, time-bending adventure with deep roots in mythological legend. A snappy attack/dodge/parry loop that players can enhance with an array of special moves (air dashes!) and supernatural abilities (teleportation!) lends acrobatic flair to the combat. But while the action is the star of Prince of Persia: The Lost Crown, it’s the brilliantly conceived, labyrinthine world that keeps people coming back. Packed with secrets, shortcuts, and surprises, the beautifully interconnected levels form a platforming playground that brings this beloved series up to speed — and offers a glimpse into its bright future."
