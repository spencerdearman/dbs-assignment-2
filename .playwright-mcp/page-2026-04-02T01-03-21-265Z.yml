                - heading "Infinity Nikki" [level=4] [ref=e542]
              - paragraph [ref=e543]: Infold Games, Singapore
              - paragraph [ref=e544]: iPhone, iPad
              - paragraph [ref=e545]: A wonderland of texture, light, and animation, Infinity Nikki is one of the best-looking games of the year. This open-world game — which challenges players to collect clothes instead of weapons — is awash in wildly detailed fabrics, beautifully realized lighting, and effects from advanced shading techniques like Global Illumination. Notice how Nikki’s dress sways and waves, and marvel at the sparkle on every last piece of fabric in every world. Lavish yet cozy at the same time, Infinity Nikki is an often literally glowing example of what mobile graphics can be.
          - generic [ref=e547]:
            - link [ref=e548] [cursor=pointer]:
              - /url: https://apps.apple.com/us/app/id6502953520
              - figure [ref=e549]
            - generic [ref=e550]:
              - link "Control Ultimate Edition" [ref=e551] [cursor=pointer]:
                - /url: https://apps.apple.com/us/app/id6502953520
                - heading "Control Ultimate Edition" [level=4] [ref=e552]
              - paragraph [ref=e553]: Remedy Entertainment PLC, Finland
              - paragraph [ref=e554]: Mac
              - paragraph [ref=e555]: Twisting hallways, looming cityscapes, creepy stone-white heads — they’re all part of the visual masterpiece that is Control. The game is a visual feast, making remarkable use of hardware-accelerated ray tracing to conjure up battlegrounds like the ominously clean offices of the Federal Bureau of Control. Every detail — from the reflections in the boardroom windows to the characters’ subtle eye darts while speaking — is expertly drawn and choreographed. Take a moment to marvel at the particle, smoke, and 3D effects as you’re busting up environments.
          - generic [ref=e557]:
            - link [ref=e558] [cursor=pointer]:
              - /url: https://apps.apple.com/us/app/id6737359999
              - figure [ref=e559]
            - generic [ref=e560]:
              - link "Neva" [ref=e561] [cursor=pointer]:
                - /url: https://apps.apple.com/us/app/id6737359999
                - heading "Neva" [level=4] [ref=e562]
              - paragraph [ref=e563]: Devolver Digital, USA
              - paragraph [ref=e564]: Mac
              - paragraph [ref=e565]: Created by the team behind the gorgeous adventure Gris, Neva is a masterful connection of visual language and emotion. The game follows a girl and her wolf as they make their way through a decaying world, using the changing of the seasons to illustrate not just the challenges of their reality but the evolution of their relationship. Each Neva level has its own color palette, and the camera skillfully zooms in and out to showcase extended horizons or sumptuously animated combat. Neva is an artistic achievement and an emotional powerhouse.
