                - 'heading "Evolve: Daily Self-Care Coach" [level=4] [ref=e173]'
              - paragraph [ref=e174]: GTA Solutions, India
              - paragraph [ref=e175]: iPhone, iPad
              - paragraph [ref=e176]: A beautifully designed health and fitness app that’s uniquely focused on the LGBTQ+ community. Evolve offers thoughtfully conceived and well-designed breathing exercises, affirmations, and daily journaling. With a friendly and straightforward tone, inclusive language, and a variety of diverse voices, it’s clearly intended to be a safe space for all, and it’s nicely integrated with features like Image Playground and the State of Mind API. A welcome and comfortable resource that’s been brought to life with thought and care.
          - generic [ref=e178]:
