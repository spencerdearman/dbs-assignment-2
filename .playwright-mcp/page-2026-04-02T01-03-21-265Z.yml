                - /url: https://apps.apple.com/us/app/id6471676214
                - heading "Gears & Goo" [level=4] [ref=e383]
              - paragraph [ref=e384]: Resolution Games AB, Sweden
              - paragraph [ref=e385]: Apple Vision Pro
              - paragraph [ref=e386]: What’s more fun than defending your tower by throwing around blobs of goo? This polished and sticky spatial game features top-of-the-line integration of eye tracking and hand control. The experience of picking up and plopping down your units on the battlefield feels tactile (and awfully fun). And the game is easy to pick up, understand, and enjoy.
          - generic [ref=e388]:
            - link [ref=e389] [cursor=pointer]:
