              - link "Art of Fauna" [ref=e200] [cursor=pointer]:
                - /url: https://apps.apple.com/us/app/id1630468596
                - heading "Art of Fauna" [level=4] [ref=e201]
              - paragraph [ref=e202]: Klemens Strasser, Austria
              - paragraph [ref=e203]: iPhone, iPad
              - paragraph [ref=e204]: A uniquely drawn puzzle game that prioritizes inclusivity and ecology in equal measure. Inspired by an encounter with 18th and 19th century science texts, Art of Fauna’s throwback-style wildlife puzzles can be solved by either re-arranging the image on the front of the cards, or re-ordering the text description on the back. As in his previous Apple Design Award finalists, Letter Rooms and Ancient Board Game Collection, Strasser designed with accessibility in mind, adding color themes, full VoiceOver support, and phobia settings that let players opt out of seeing potentially upsetting imagery. Plus, proceeds from every purchase support wildlife conservation organizations.
          - generic [ref=e206]:
            - link [ref=e207] [cursor=pointer]:
