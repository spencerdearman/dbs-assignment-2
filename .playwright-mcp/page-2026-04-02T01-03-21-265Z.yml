              - link "Neva" [ref=e455] [cursor=pointer]:
                - /url: https://apps.apple.com/us/app/id6737359999
                - heading "Neva" [level=4] [ref=e456]
              - paragraph [ref=e457]: Devolver Digital, USA
              - paragraph [ref=e458]: Mac
              - paragraph [ref=e459]: A powerful, sometimes somber, and richly illustrated story about the emotional effects of environmental decline. Created by the team behind the gorgeous Gris, Neva follows a girl and her wolf as they make their way through a decaying world, using the changing of the seasons to illustrate not just the challenges of their reality but the evolution of their relationship. Players are charged with escorting the pair safely through the game’s breathtakingly realized world, which shines in every season. But the game’s true heart is the connection between the pair, which reminds us what it means to care for something — or someplace.
          - generic [ref=e461]:
