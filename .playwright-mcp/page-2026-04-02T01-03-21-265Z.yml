                - heading "Moises" [level=4] [ref=e256]
              - paragraph [ref=e257]: Music.AI, Brazil
              - paragraph [ref=e258]: iPhone, iPad
              - paragraph [ref=e259]: This musical marvel isolates the instruments in a recorded song, using machine learning models to separate out the vocals, guitar, bass, drums, and more into individual tracks. The effect is absolutely mind-bending. You can remove a guitar solo and supply your own, turn any song into an a cappella, or play around with pitch and tempo, all of which can make it feel like you’re hearing a favorite song for the first time. But for all its technical magic, Moises is remarkably easy to understand and navigate, which leaves you not just astounded at its powers, but compelled to rediscover your music.
