                - heading "Ahoy! From Picardy" [level=4] [ref=e467]
              - paragraph [ref=e468]: Daniel Jones, USA
              - paragraph [ref=e469]: Apple Vision Pro
              - paragraph [ref=e470]: A whimsical experience that’s part redemption arc and part environmental warning. This inventive game features a character named Picardy, a man who’s desperate to make up for past mistakes and bring beauty into his part of the world. The game maximizes the potential of the spatial canvas, offering many compelling ways for players to interact with the richly drawn world (and take in its wonderful soundscapes), all in service of a message about environmental stewardship — and the difficulty in changing institutions.
