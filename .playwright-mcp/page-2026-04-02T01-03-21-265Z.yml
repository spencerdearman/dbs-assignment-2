                - heading "Speechify" [level=4] [ref=e163]
              - paragraph [ref=e164]: Speechify, USA
              - paragraph [ref=e165]: iPhone, iPad
              - paragraph [ref=e166]: "With hundreds of voices and more than 50 available languages, Speechify turns any written text into audio — everything from websites, documents, scans, PDFs, and more. The app offers an approachable UI with a variety of accessibility features — Dynamic Type and VoiceOver among them — that make it an instantly helpful tool for everyone: students, professionals, and leisure readers, as well as auditory learners and people with low vision. The design team clearly worked to reduce cognitive load all throughout the app too. Speechify is more than a great app; it’s a critical resource that helps people live their lives."
