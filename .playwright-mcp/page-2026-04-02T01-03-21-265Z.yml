                - heading "CapWords" [level=4] [ref=e79]
              - paragraph [ref=e80]: HappyPlan Tech, China
              - paragraph [ref=e81]: iPhone, iPad
              - paragraph [ref=e82]: "The delightful language-learning app CapWords offers an idea that’s as simple as it is revolutionary: Learn the name of a thing by taking a picture of it. With the snap of a camera and a fun animation, CapWords transforms everyday objects — coffee mugs, traffic cones, cupcakes — into interactive stickers. It’s both a dynamic new path to learning and a really fun thing to do; it’s hard to stop snapping pictures of everything around you. And each flash card transition is accompanied by a real-world sound, a little tweak that enhances the sensory experience (and helps the word stick). Equal fun for kids and adults, CapWords makes the whole world a language playground."
