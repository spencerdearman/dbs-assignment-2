          - generic [ref=e117]:
            - heading "Comparing Flighty vs. FlightAware" [level=2] [ref=e119]
            - paragraph [ref=e121]: Flighty and FlightAware are popular flight tracker apps, but which is right for you? They each offer flight tracking data, but they’re built for different types of user-cases, flyers, and serve different needs. Here’s a complete overview to help you choose the best flight tracking app for you.
            - heading "What sets Flighty and FlightAware a part?" [level=3] [ref=e123]
            - generic [ref=e124]:
              - paragraph [ref=e125]:
                - strong [ref=e126]: Flighty
                - text: is an independent, ad-free flight tracker built by serious travelers for serious travelers. We were frustrated by the lack of information and transparency when flying, so we built Flighty for any traveler to access an all-in-one, award-winning flight tracker and get the fastest alerts, from delays to cancellations, all with unmatched accuracy.
              - paragraph [ref=e127]:
                - strong [ref=e128]: FlightAware
                - text: —now owned by Collins Aerospace—is a data and analytics company focused on flight tracking. Individuals can access their site and ad-supported app to track flights, but mostly its focus is providing aviation analytics to companies, large corporations, and governments that use the analytics to enhance their service (like Flighty!) or manage and track large fleets.
            - heading "Why choose Flighty?" [level=2] [ref=e130]
            - generic [ref=e131]:
              - paragraph [ref=e132]: "Flighty has all the features of FlightAware's app, including departure times, gates, connections, and delays, as well as airport alerts and tracking inbound planes. Flighty provides even more, including exclusive features, such as:"
