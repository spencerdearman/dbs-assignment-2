          - paragraph [ref=e136]: About Flighty
          - paragraph [ref=e138]: Flighty is a highly-decorated flight app with the power to revolutionize your travel game. It launched in 2019 by a team of just 3 flight nerds from across the globe and has quickly become the preferred app of flight crews and frequent fliers worldwide.
          - paragraph [ref=e140]: The app elegantly combines an award-winning interface that’s comforting and easy to use, with powerful and detailed real-time flight details, such as delays, gate changes, and cancellations – often long before airlines communicate them to you.
          - paragraph [ref=e142]: Flighty acts as both a flight companion and a travel log, allowing you to quickly load your previous and future flights onto the app with flight numbers and booking references from your email, calendar, TripIt, or manually. The app was a 2023 App of the Year Finalist, 2023 Apple Design Award winner, and boasts millions of users.
