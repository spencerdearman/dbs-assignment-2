          - heading "How it works" [level=2] [ref=e141]
          - paragraph [ref=e142]:
            - text: Behind the scenes, Flighty links your flight to its inbound aircraft and begins monitoring it up to
            - strong [ref=e143]: 25 hours before departure
            - text: .
          - paragraph [ref=e144]: Unlike other flight trackers that only follow your flight number, Flighty tracks the actual airplane. This lets us identify and alert issues about your flight to you as early as possible. If your inbound aircraft is delayed, there’s a good chance your departure will be, too.
          - heading "Why it matters" [level=2] [ref=e145]
          - paragraph [ref=e146]:
            - text: Seeing your aircraft’s real progress gives you a realistic picture of where it’s coming from, helping you understand potential delays
            - emphasis [ref=e147]: before the airline even announces them
            - text: . Flighty predicts and communicates delays hours ahead of official updates, so you can stay informed and make decisions faster.
