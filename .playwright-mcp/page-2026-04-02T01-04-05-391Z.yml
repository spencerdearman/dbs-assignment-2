        - generic [ref=e127]:
          - paragraph [ref=e128]:
            - strong [ref=e129]: Where Is My Plane?
            - text: shows you where the exact aircraft scheduled to operate your flight is now, and how it’s getting to your airport.
          - paragraph [ref=e130]:
            - text: To view it, open your flight in Flighty and scroll to
            - strong [ref=e131]: Where’s My Plane?
            - text: ". You’ll see:"
          - list [ref=e132]:
